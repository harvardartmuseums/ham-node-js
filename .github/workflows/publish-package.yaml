name: Publish Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write    # required for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later, which is newer than the
      # version bundled with Node.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check the release tag matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - run: npm ci

      # No NODE_AUTH_TOKEN: this authenticates over OIDC. Provenance is generated
      # automatically, so --provenance is not needed.
      - run: npm publish
